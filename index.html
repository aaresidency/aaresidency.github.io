    <!-- Google tag (gtag.js). The queue below is set up immediately so no event is lost, but the 165 KB library
         itself loads on first interaction (or 5 s after load) so it doesn't compete with the hero image on slow phones. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'AW-17283929589');
      (function () {
        var events = ['scroll', 'pointerdown', 'keydown', 'touchstart'];
        var loaded = false;
        function load() {
          if (loaded) return;
          loaded = true;
          events.forEach(function (e) { removeEventListener(e, load); });
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=AW-17283929589';
          document.head.appendChild(s);
        }
        events.forEach(function (e) { addEventListener(e, load, { passive: true }); });
        addEventListener('load', function () { setTimeout(load, 5000); });
      })();
    </script>

    <script>
      // Decode the deep-link path GitHub Pages' 404.html encoded, and restore the
      // real URL before the SPA router mounts. https://github.com/rafgraph/spa-github-pages
      (function (l) {
        // public/404.html redirects deep links to /?p=/path&q=query.
        var m = l.search.match(/^\?p=(\/[^&]*)(?:&q=(.*))?$/)
        if (m) {
          var restored = m[1].replace(/~and~/g, '&') + (m[2] ? '?' + m[2].replace(/~and~/g, '&') : '')
          window.history.replaceState(null, '', restored + l.hash)
        } else if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
